<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Full Piano Keyboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="piano">

    <!-- Octave 1 -->
    <div class="key white" id="Q">Q</div>
    <div class="key black" id="W">W</div>
    <div class="key white" id="E">E</div>
    <div class="key black" id="R">R</div>
    <div class="key white" id="T">T</div>
    <div class="key white" id="Y">Y</div>
    <div class="key black" id="U">U</div>
    <div class="key white" id="I">I</div>
    <div class="key black" id="O">O</div>
    <div class="key white" id="P">P</div>
    <div class="key black" id="A">A</div>
    <div class="key white" id="S">S</div>

    <!-- Octave 2 -->
    <div class="key white" id="D">D</div>
    <div class="key black" id="F">F</div>
    <div class="key white" id="G">G</div>
    <div class="key black" id="H">H</div>
    <div class="key white" id="J">J</div>
    <div class="key white" id="K">K</div>
    <div class="key black" id="L">L</div>
    <div class="key white" id="Z">Z</div>
    <div class="key black" id="X">X</div>
    <div class="key white" id="C">C</div>
    <div class="key black" id="V">V</div>
    <div class="key white" id="B">B</div>

    <!-- Octave 3 -->
    <div class="key white" id="N">N</div>
    <div class="key black" id="M">M</div>
    <div class="key white" id="LEFT_TAB">LEFT TAB</div>
    <div class="key black" id="CAPS">CAPS</div>
    <div class="key white" id="LEFT_SHIFT">LEFT SHIFT</div>
    <div class="key white" id="LEFT_CTRL">LEFT CTRL</div>
    <div class="key black" id="FN">FN</div>
    <div class="key white" id="LEFT_ALT">LEFT ALT</div>
    <div class="key black" id="RIGHT_ALT">RIGHT ALT</div>
    <div class="key white" id="RIGHT_SHIFT">RIGHT SHIFT</div>
    <div class="key black" id="ENTER">ENTER</div>
    <div class="key white" id="BACKSPACE">BACKSPACE</div>

  </div>

  <script src="script.js"></script>
</body>
</html>
